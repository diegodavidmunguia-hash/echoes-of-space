      <p class="eyebrow" data-t="contribute"></p><h2 id="uploadTitle" data-t="upload"></h2>
      <form id="uploadForm">
        <p class="muted upload-intro" data-t="publishIntro"></p>
        <p id="uploadLogin" class="muted" hidden><span data-t="login_required"></span> <a href="/signin?return_to=%2Frelatos%23submit" target="_top" data-t="signIn"></a></p>
        <div id="uploadFields">
        <section class="upload-step" aria-labelledby="stepStory">
          <h3 class="form-heading" id="stepStory"><span class="step-no" aria-hidden="true">01</span><span data-t="storyDetails"></span></h3>
          <div class="form-grid">
            <label><span data-t="title"></span><input name="title" maxlength="100" required></label>
            <label><span data-t="bylineLabel"></span><input name="byline" maxlength="60" required autocomplete="nickname"></label>
          </div>
          <label class="synopsis-field"><span class="field-head"><span data-t="synopsisLabel"></span><span class="char-count" id="synopsisCount" aria-hidden="true">0 / 240</span></span><textarea name="synopsis" rows="3" maxlength="240"></textarea><span class="field-help" data-t="synopsisHelp"></span></label>
          <div class="upload-media">
            <label class="file-drop" id="fileDrop">
              <input type="file" name="document" accept=".txt,.pdf,.md,application/pdf,text/plain,text/markdown" required aria-describedby="fileHelp fileName">
              <span class="drop-icon" aria-hidden="true"></span>
              <strong data-t="file"></strong>
              <span class="drop-cta" data-t="fileCta"></span><span class="drop-cta drop-replace" data-t="fileReplace"></span>
              <span class="drop-meta" id="fileHelp" data-t="fileHelp"></span>
              <span class="drop-name" id="fileName" aria-live="polite"></span>
            </label>
            <div class="cover-field">
              <label class="cover-slot" for="coverFile">
                <img id="coverPreview" hidden alt="" width="72" height="108">
                <span class="cover-empty"><span aria-hidden="true">+</span><strong data-t="coverLabel"></strong></span>
                <input type="file" name="cover" id="coverFile" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" aria-describedby="coverHint coverStatus">
              </label>
              <p id="coverHint" class="cover-hint" data-t="coverHint"></p>
              <button class="plain" type="button" id="clearCover" hidden data-t="clearCover"></button>
              <p id="coverStatus" role="status"></p>
            </div>
          </div>
        </section>
        <section class="upload-step" aria-labelledby="stepContext">
          <h3 class="form-heading" id="stepContext"><span class="step-no" aria-hidden="true">02</span><span data-t="storyContext"></span></h3>
          <div class="form-grid">
            <label><span data-t="dest"></span><select name="destination" required></select></label>
            <label><span data-t="equipment"></span><select name="type" required></select></label>
            <label><span data-t="object"></span><input name="hardware" maxlength="80" required data-placeholder="hardwarePlaceholder"></label>
            <label><span data-t="storyLanguage"></span><select name="language" required></select></label>
          </div>
        </section>
        <section class="upload-step" aria-labelledby="stepKind">
          <h3 class="form-heading" id="stepKind"><span class="step-no" aria-hidden="true">03</span><span data-t="storyKind"></span></h3>
          <fieldset class="category-choice">
            <legend class="sr" data-t="category"></legend>
            <label class="choice"><input type="radio" name="category" value="nasa" required><span class="choice-mark" aria-hidden="true"></span><span class="choice-copy"><strong data-t="nasa"></strong><small data-t="nasaChoiceHint"></small></span></label>
            <label class="choice"><input type="radio" name="category" value="fiction" required><span class="choice-mark" aria-hidden="true"></span><span class="choice-copy"><strong data-t="fiction"></strong><small data-t="fictionChoiceHint"></small></span></label>
            <label class="choice"><input type="radio" name="category" value="character" required><span class="choice-mark" aria-hidden="true"></span><span class="choice-copy"><strong data-t="character"></strong></span></label>
          </fieldset>
          <div id="sourceBlock" hidden><label><span data-t="sources"></span><textarea name="sources" rows="3" maxlength="2510" placeholder="https://science.nasa.gov/…"></textarea></label><p class="field-help" data-t="sourceHelp"></p></div>
          <details id="advancedUpload">
            <summary data-t="advancedUpload"></summary>
            <div class="form-grid">
            <label><span data-t="tagsLabel"></span><input name="tags" maxlength="180" placeholder="#Voyager, #Neptune"></label>
            <label><span data-t="format"></span><select name="format"><option value="single" data-t="single"></option><option value="new" data-t="newSeries"></option><option value="continue" data-t="continueSeries"></option></select></label>
            <label id="seriesNameLabel" hidden><span data-t="seriesName"></span><input name="seriesName" maxlength="80" disabled></label>
            <label id="seriesSelectLabel" hidden><span data-t="seriesSelect"></span><select name="seriesId" disabled></select></label>
            </div>
          </details>
        </section>
        <div class="upload-footer">
          <p id="uploadStatus" role="status" aria-live="polite"></p>
          <p class="upload-privacy" data-t="uploadPrivacy"></p>
          <button class="primary" id="publish" type="submit" data-t="publish"></button>
        </div>
        </div>
      </form>
    </div>
